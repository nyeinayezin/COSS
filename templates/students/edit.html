{% extends "base.html" %}

{% block content %}
    <h1>Edit Student</h1>

    <form method="POST">
        <div>
            <label for="first_name">First Name</label>
            <input
                type="text"
                id="first_name"
                name="first_name"
                value="{{ student.first_name }}"
                required
            >
        </div>

        <div>
            <label for="last_name">Last Name</label>
            <input
                type="text"
                id="last_name"
                name="last_name"
                value="{{ student.last_name }}"
                required
            >
        </div>

        <button type="submit">Save Changes</button>
        <a href="{{ url_for('students.list_students') }}">
            Cancel
        </a>
    </form>
{% endblock %}
